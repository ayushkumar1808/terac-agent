<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Find verified human experts through Terac." />
    <title>Terac Agent</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="shell">
      <header>
        <div class="mark">T</div>
        <div>
          <p class="eyebrow">PUBLIC DEMO</p>
          <h1>Terac Agent</h1>
        </div>
        <span class="status"><i></i> Online</span>
      </header>

      <section id="messages" class="messages" aria-live="polite">
        <article class="message agent">
          <div class="avatar">T</div>
          <div>
            <p>I can source verified human experts through Terac. Tell me who you need and what outcome you want.</p>
            <div class="suggestions">
              <button>Find a US CPA for personal taxes</button>
              <button>Source a senior React code reviewer</button>
              <button>Recruit five customer interviews</button>
            </div>
          </div>
        </article>
      </section>

      <form id="composer">
        <textarea id="message" rows="1" maxlength="8000" placeholder="Describe the expert or human work you need..." required></textarea>
        <button id="send" type="submit" aria-label="Send message">Send</button>
      </form>
      <p class="note">The agent will ask before launching work that can spend Terac credits.</p>
    </main>
    <script src="/app.js" type="module"></script>
  </body>
</html>
